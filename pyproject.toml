[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gate"
version = "0.1.0"
description = "One read-only command that checks a repo against its declared rules, for any agent harness, git hook, or CI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lizard>=1.17",
    "tree-sitter-language-pack>=1.8",
]

[project.optional-dependencies]
# Everything gate's own gate runs, so a fresh clone or CI checks the same things.
dev = ["pytest>=8.0", "ruff>=0.12", "mypy>=1.15"]

[project.scripts]
gate = "gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Stated here so the result does not depend on which ruff version is installed.
[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = ["lizard"]
ignore_missing_imports = true
