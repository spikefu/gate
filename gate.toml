# gate checks itself. Tools come from this repo's .venv when it has one, else PATH.

[toolchain]
lint = "ruff check ."
typecheck = "mypy"

[tests.unit]
command = "pytest -q tests/unit"

[tests.integration]
command = "pytest -q tests/integration"

[boundaries]
# Checks are leaves: nothing below them may depend on the runner or the CLI.
forbid = [
  "src/gate/checks !-> src/gate/runner.py",
  "src/gate/checks !-> src/gate/cli.py",
  "src/gate/lang !-> src/gate/checks",
]

[profiles]
fast = ["syntax", "complexity", "size", "boundaries", "suppressions", "test-integrity", "duplication", "lint"]
full = ["syntax", "complexity", "size", "boundaries", "suppressions", "test-integrity", "duplication", "lint", "typecheck", "unit", "integration"]
