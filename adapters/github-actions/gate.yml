# Copy to .github/workflows/gate.yml in a repo that has a gate.toml.
#
# --strict makes a check that could not run a failure, so CI never passes
# because a linter was missing. Install your project's own tools (npm ci,
# pip install, ...) before the gate step so the toolchain checks can run.
name: gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "git+https://github.com/spikefu/gate@main"
      - run: gate check --profile full --strict
      # The baseline may only shrink, and agents must be told the current rules.
      - run: gate baseline --check
      - run: gate rules --check
