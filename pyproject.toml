[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gate"
version = "0.1.0"
description = "One read-only command that checks a repo against its declared rules, for any agent harness, git hook, or CI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lizard>=1.17",
    "tree-sitter-language-pack>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gate = "gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
